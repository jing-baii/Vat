<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modern VAT Calculator</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      color: #f8fafc;
      padding: 16px;
    }

    .calculator-card {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 32px;
      border-radius: 20px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 10px 10px -5px rgba(0, 0, 0, 0.2);
      width: 100%;
      max-width: 420px;
    }

    h2 {
      margin-top: 0;
      margin-bottom: 24px;
      color: #ffffff;
      text-align: center;
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: -0.5px;
    }

    .input-group {
      margin-bottom: 24px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 0.875rem;
      font-weight: 500;
      color: #94a3b8;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .currency-symbol {
      position: absolute;
      left: 14px;
      color: #64748b;
      font-weight: 600;
    }

    input[type="number"] {
      width: 100%;
      padding: 14px 14px 14px 32px;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid #334155;
      border-radius: 10px;
      font-size: 1.125px;
      font-size: 1.1rem;
      color: #ffffff;
      outline: none;
      transition: all 0.3s ease;
    }

    input[type="number"]:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
    }

    input::placeholder {
      color: #475569;
    }

    .results-group {
      background: rgba(15, 23, 42, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.05);
      padding: 20px;
      border-radius: 12px;
    }

    .result-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .result-row:last-child {
      margin-bottom: 0;
    }

    .result-label {
      color: #94a3b8;
      font-size: 0.9rem;
    }

    .result-value {
      font-weight: 600;
      color: #38bdf8;
      font-size: 1.15rem;
    }

    .result-row:last-child .result-value {
      color: #34d399;
    }
  </style>
</head>
<body>

  <div class="calculator-card">
    <h2>VAT Calculator</h2>
    
    <div class="input-group">
      <label for="grossPrice">Original Price (VAT Inclusive)</label>
      <div class="input-wrapper">
        <span class="currency-symbol">₱</span>
        <input type="number" id="grossPrice" placeholder="0.00" step="any" oninput="calculateVAT()" autofocus>
      </div>
    </div>

    <div class="results-group">
      <div class="result-row">
        <span class="result-label">Net of VAT (÷ 1.12):</span>
        <span class="result-value" id="netVat">0.00</span>
      </div>
      <div class="result-row">
        <span class="result-label">Less VAT (12%):</span>
        <span class="result-value" id="vatAmount">0.00</span>
      </div>
    </div>
  </div>

  <script>
    function calculateVAT() {
      const grossPrice = parseFloat(document.getElementById('grossPrice').value);

      if (isNaN(grossPrice) || grossPrice <= 0) {
        document.getElementById('netVat').innerText = '0.00';
        document.getElementById('vatAmount').innerText = '0.00';
        return;
      }

      // Calculation logic
      const netVat = grossPrice / 1.12;
      const vatAmount = grossPrice - netVat;

      // Update values formatted to 2 decimal places
      document.getElementById('netVat').innerText = netVat.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      document.getElementById('vatAmount').innerText = vatAmount.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }
  </script>

</body>
</html>
